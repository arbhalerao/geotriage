server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without a resolver, nginx looks each upstream up once at
    # startup and caches the address forever — so rebuilding the api container, which
    # gives it a new IP, leaves the UI proxying to a dead one until nginx is restarted.
    # Naming the upstream in a variable forces a lookup per request instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /titiler/ {
        set $titiler_upstream titiler;
        rewrite ^/titiler/(.*)$ /$1 break;
        proxy_pass http://$titiler_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
